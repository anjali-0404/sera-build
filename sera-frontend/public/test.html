<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERA Backend Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }
        .status {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: 500;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        .status::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status.success::before { background: #28a745; }
        .status.error::before { background: #dc3545; }
        .status.pending::before { background: #ffc107; }
        
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 15px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #764ba2; }
        .response {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            word-break: break-all;
        }
        .link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚑 SERA Backend Test Center</h1>
        
        <div class="section">
            <h2>Service Status</h2>
            <div class="status pending" id="frontendStatus">Frontend: Checking...</div>
            <div class="status pending" id="backendStatus">Backend: Checking...</div>
        </div>

        <div class="section">
            <h2>Backend API Tests</h2>
            <button onclick="testHealth()">Health Check</button>
            <button onclick="testHospitals()">Get Hospitals</button>
            <button onclick="registerUser()">Register User</button>
            <button onclick="loginUser()">Login User</button>
            <div class="response" id="response" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>Quick Links</h2>
            <p>
                <a href="http://localhost:5173" class="link">→ Frontend (http://localhost:5173)</a><br>
                <a href="http://localhost:8081/health" class="link">→ Backend Health (http://localhost:8081/health)</a>
            </p>
        </div>
    </div>

    <script>
        const baseURL = 'http://localhost:8081';

        async function showResponse(data, title = 'Response') {
            const responseDiv = document.getElementById('response');
            responseDiv.style.display = 'block';
            responseDiv.innerHTML = `<strong>${title}</strong><br><pre>${JSON.stringify(data, null, 2)}</pre>`;
        }

        async function testHealth() {
            try {
                const res = await fetch(`${baseURL}/health`);
                const data = await res.json();
                showResponse(data, 'Health Status');
            } catch (err) {
                showResponse(err.message, 'Error');
            }
        }

        async function testHospitals() {
            try {
                const res = await fetch(`${baseURL}/api/hospital/all`);
                const data = await res.json();
                showResponse(data.slice(0, 2), 'First 2 Hospitals');
            } catch (err) {
                showResponse(err.message, 'Error');
            }
        }

        async function registerUser() {
            try {
                const res = await fetch(`${baseURL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123',
                        name: 'Test User'
                    })
                });
                const data = await res.json();
                showResponse(data, 'Register Response');
            } catch (err) {
                showResponse(err.message, 'Error');
            }
        }

        async function loginUser() {
            try {
                const res = await fetch(`${baseURL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });
                const data = await res.json();
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    showResponse(data, 'Login Successful - Token saved!');
                } else {
                    showResponse(data, 'Login Response');
                }
            } catch (err) {
                showResponse(err.message, 'Error');
            }
        }

        async function checkStatus() {
            // Frontend check
            try {
                await fetch(window.location.href);
                document.getElementById('frontendStatus').textContent = '✓ Frontend: Running';
                document.getElementById('frontendStatus').className = 'status success';
            } catch {
                document.getElementById('frontendStatus').textContent = '✗ Frontend: Error';
                document.getElementById('frontendStatus').className = 'status error';
            }

            // Backend check
            try {
                const res = await fetch(`${baseURL}/health`);
                if (res.ok) {
                    document.getElementById('backendStatus').textContent = '✓ Backend: Running';
                    document.getElementById('backendStatus').className = 'status success';
                } else {
                    throw new Error('Not ok');
                }
            } catch {
                document.getElementById('backendStatus').textContent = '✗ Backend: Unreachable';
                document.getElementById('backendStatus').className = 'status error';
            }
        }

        // Check status on load
        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
